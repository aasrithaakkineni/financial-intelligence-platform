<!DOCTYPE html>
<html>
<head>
    <title>Financial Intelligence Platform</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Financial Intelligence Platform</h1>
    <h2>Processed Stock Data Dashboard</h2>

    <button onclick="showMessage()">View Data</button>

    <br><br>

    <input
        type="text"
        id="searchInput"
        placeholder="Search company..."
        onkeyup="searchCompany()"
    >

    <br><br>

    <label for="companySelect"><b>Select Company:</b></label>

    <select id="companySelect">
        <option value="">-- Select Company --</option>
        <option>Apple</option>
        <option>Tesla</option>
        <option>Microsoft</option>
    </select>

    <br><br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Sector</th>
                <th>Market Cap</th>
                <th>Health Score</th>
                <th>Health Status</th>
                <th>Revenue</th>
                <th>Net Profit</th>
            </tr>
        </thead>

        <tbody id="stockTable">
        </tbody>
    </table>

    <footer>
        <p>Financial Intelligence Platform © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
